name: CI

on:
  push:
    branches: [ios27-upgrade, main]
  pull_request:
    branches: [ios27-upgrade]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE_PATH=$(ls -dv /Applications/Xcode*.app | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -E '^iOS' || true

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('StevePinyin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run unit tests
        run: |
          set -o pipefail
          for DEST in \
            'platform=iOS Simulator,name=iPhone 17 Pro,OS=newest' \
            'platform=iOS Simulator,name=iPhone 16 Pro,OS=newest' \
            'platform=iOS Simulator,name=iPhone 17,OS=newest'
          do
            echo "Trying destination: $DEST"
            rm -rf TestResults.xcresult
            if xcodebuild test \
              -project StevePinyin.xcodeproj \
              -scheme StevePinyin \
              -destination "$DEST" \
              -only-testing:StevePinyinTests \
              -resultBundlePath TestResults.xcresult; then
              exit 0
            fi
          done
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
