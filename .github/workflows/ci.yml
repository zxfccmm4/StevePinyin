name: CI

on:
  push:
    branches: [ios27-upgrade, main]
  pull_request:
    branches: [ios27-upgrade]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (iOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin Xcode 27.1 (matches local dev build 27A9275)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Show simulator inventory
        run: |
          xcrun simctl list runtimes | grep -E '^iOS' || true
          xcrun simctl list devices available | grep -E 'iPhone' | head -5 || true

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('StevePinyin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run unit tests
        run: |
          set -o pipefail
          # Pick the first available iPhone simulator by UDID — immune to device-name drift
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for devs in devices.values():
              for dev in devs:
                  if dev["isAvailable"] and "iPhone" in dev["name"]:
                      print(dev["udid"]); raise SystemExit
          ' || true)
          if [ -n "$UDID" ]; then
            DEST="id=$UDID"
          else
            DEST='platform=iOS Simulator,name=iPhone 17 Pro,OS=newest'
          fi
          echo "Destination: $DEST"
          xcodebuild test \
            -project StevePinyin.xcodeproj \
            -scheme StevePinyin \
            -destination "$DEST" \
            -only-testing:StevePinyinTests \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
